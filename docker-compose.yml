# ============================================================================
#  전체 실행 — DB · API · 웹을 각각 따로 띄웁니다.
#  ---------------------------------------------------------------------------
#    docker compose up -d --build
#
#  · 밖으로 열리는 문은 fit(nginx) 하나뿐입니다. api 와 db 는 컨테이너
#    네트워크 안에서만 서로를 봅니다. DB 포트가 인터넷에 열려 있는 것만큼
#    위험한 것도 드뭅니다.
#  · 브라우저에서 보면 화면과 API 가 같은 주소입니다. nginx 가 /api 를
#    api 컨테이너로 넘깁니다.
#
#  먼저 .env.example 을 .env 로 복사해 값을 채워 주세요.
# ============================================================================

services:
  db:
    image: postgres:16-alpine
    container_name: fit-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-fit}
      POSTGRES_USER: ${DB_USER:-fit}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD 를 .env 에 넣어 주세요}
      # 한글 정렬·비교가 어긋나지 않게 초기화 때 로케일을 맞춰 둡니다.
      LANG: ko_KR.utf8
      # 로그와 psql 의 시각을 api 와 같은 시계로 읽습니다. 저장되는 값
      # (timestamptz)은 이 값과 무관합니다.
      TZ: ${TZ:-Asia/Seoul}
    volumes:
      - fit-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-fit} -d ${DB_NAME:-fit}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./backend
    container_name: fit-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/${DB_NAME:-fit}
      DB_USER: ${DB_USER:-fit}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD 를 .env 에 넣어 주세요}

      # 32바이트 이상. 바꾸면 이미 나간 토큰이 전부 무효가 됩니다.
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET 을 .env 에 넣어 주세요}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-30d}

      # 최초 운영자를 만들 때 한 번 쓰고, 만든 뒤에는 비워 두는 편이 좋습니다.
      SETUP_TOKEN: ${SETUP_TOKEN:-}

      # HTTPS 뒤가 아니면 true 로 둘 수 없습니다. 아래 .env 설명을 읽어 주세요.
      SECURE_COOKIE: ${SECURE_COOKIE:-false}

      # 브라우저는 nginx 를 거쳐 같은 주소로 오므로 CORS 를 타지 않습니다.
      # 이 값은 따로 띄운 화면(예: expo start --web)에서 부를 때만 쓰입니다.
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8081}

      # 장소 검색을 서버가 대신 합니다. 키가 앱·브라우저로 나가지 않습니다.
      GOOGLE_MAPS_KEY: ${GOOGLE_MAPS_KEY:-}

      # 서버가 보는 "지금" 과 "오늘".
      #
      # 안 넣으면 컨테이너가 UTC 로 돕니다. 그러면 자바의 LocalDate.now() 가
      # 아홉 시간 이른 날짜를 말하고, 정해 둔 시각에 도는 일들이 엉뚱한 때에
      # 돕니다. 실제로 이런 일이 있었습니다.
      #
      #   TripReminder    "0 0 20 * * *" — 전날 저녁 여덟 시에 내일 일정을
      #                   알리려던 것이 20:00 UTC, 곧 새벽 다섯 시에 갔습니다
      #   PostView        "하루 한 번" 세는 경계가 오전 아홉 시였습니다
      #   GoogleQuota     하루치 한도가 풀리는 자정이 오전 아홉 시였습니다
      #
      # 쓰는 사람이 한국에 있으므로 서버의 하루도 거기에 맞춥니다. 저장되는
      # 시각(timestamptz)은 이 값과 무관하게 정확합니다 — 달라지는 것은
      # "오늘이 며칠인가" 와 "몇 시에 도는가" 입니다.
      TZ: ${TZ:-Asia/Seoul}
    # 포트를 밖으로 열지 않습니다. web 이 대신 받습니다.
    expose:
      - "8080"

  # 이름이 곧 컨테이너 네트워크 안의 주소입니다. 터널 라우트가 http://fit:80 을
  # 가리키므로 서비스 이름을 fit 으로 둡니다.
  fit:
    build:
      context: ./frontend
      args:
        # 비워 두면 브라우저가 자기 주소로 /api 를 부릅니다. nginx 가 넘깁니다.
        EXPO_PUBLIC_API_BASE: ""
        # 지도 키는 번들에 박히므로 여기서 넣어야 합니다. 바꾸면 다시 빌드해야
        # 반영됩니다(--build).
        EXPO_PUBLIC_GMAPS_KEY: ${EXPO_PUBLIC_GMAPS_KEY:-}
    container_name: fit-web
    restart: unless-stopped
    # nginx 접속 로그의 시각도 같은 시계로 찍습니다. 세 컨테이너의 로그를
    # 나란히 놓고 볼 일이 생깁니다.
    environment:
      TZ: ${TZ:-Asia/Seoul}
    depends_on:
      api:
        condition: service_healthy
    ports:
      # 터널로 열 때는 WEB_BIND 를 127.0.0.1 로 두세요. 바깥에서 들어오는 길은
      # 터널 하나로 좁히고, 이 포트는 서버 안에서만 씁니다.
      - "${WEB_BIND:-0.0.0.0}:${WEB_PORT:-8080}:80"

  # --------------------------------------------------------------------------
  #  Cloudflare 터널 (선택)
  #  --------------------------------------------------------------------------
  #    docker compose --profile tunnel up -d --build
  #
  #  공유기 포트를 열지 않고 밖에서 들어올 수 있게 합니다. 이 컨테이너가
  #  Cloudflare 로 나가는 연결을 직접 맺고, 들어온 요청을 web 으로 넘깁니다.
  #  방화벽에 구멍을 내지 않으므로 서버 주소가 드러나지 않습니다.
  #
  #  대시보드에서 터널을 만들고 받은 토큰을 .env 의 TUNNEL_TOKEN 에 넣으세요.
  #  공개 주소와 서비스(http://fit:80) 연결도 대시보드에서 정합니다.
  # --------------------------------------------------------------------------
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: fit-tunnel
    profiles: ["tunnel"]
    restart: unless-stopped
    depends_on:
      fit:
        condition: service_healthy
    # 자동 갱신은 컨테이너에서 의미가 없습니다. 이미지를 새로 받는 편이 낫습니다.
    #
    # 값이 없으면 여기서 막지 않고 cloudflared 가 로그로 알려 줍니다. 프로필
    # 밖에 있어도 compose 는 파일 전체를 먼저 읽기 때문에, 여기서 필수로 걸면
    # 터널을 안 쓸 때도 up 이 실패합니다.
    command: tunnel --no-autoupdate run --token ${TUNNEL_TOKEN:-}

volumes:
  fit-db:
