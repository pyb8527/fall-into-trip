# ============================================================================
#  전체 실행 — DB · API · 웹을 각각 따로 띄웁니다.
#  ---------------------------------------------------------------------------
#    docker compose up -d --build
#
#  · 밖으로 열리는 문은 web(nginx) 하나뿐입니다. api 와 db 는 컨테이너
#    네트워크 안에서만 서로를 봅니다. DB 포트가 인터넷에 열려 있는 것만큼
#    위험한 것도 드뭅니다.
#  · 브라우저에서 보면 화면과 API 가 같은 주소입니다. nginx 가 /api 를
#    api 컨테이너로 넘깁니다.
#
#  먼저 .env.example 을 .env 로 복사해 값을 채워 주세요.
# ============================================================================

services:
  db:
    image: postgres:16-alpine
    container_name: fit-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-fit}
      POSTGRES_USER: ${DB_USER:-fit}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD 를 .env 에 넣어 주세요}
      # 한글 정렬·비교가 어긋나지 않게 초기화 때 로케일을 맞춰 둡니다.
      LANG: ko_KR.utf8
    volumes:
      - fit-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-fit} -d ${DB_NAME:-fit}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./backend
    container_name: fit-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/${DB_NAME:-fit}
      DB_USER: ${DB_USER:-fit}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD 를 .env 에 넣어 주세요}

      # 32바이트 이상. 바꾸면 이미 나간 토큰이 전부 무효가 됩니다.
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET 을 .env 에 넣어 주세요}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-30d}

      # 최초 운영자를 만들 때 한 번 쓰고, 만든 뒤에는 비워 두는 편이 좋습니다.
      SETUP_TOKEN: ${SETUP_TOKEN:-}

      # HTTPS 뒤가 아니면 true 로 둘 수 없습니다. 아래 .env 설명을 읽어 주세요.
      SECURE_COOKIE: ${SECURE_COOKIE:-false}

      # 브라우저는 nginx 를 거쳐 같은 주소로 오므로 CORS 를 타지 않습니다.
      # 이 값은 따로 띄운 화면(예: expo start --web)에서 부를 때만 쓰입니다.
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8081}
    # 포트를 밖으로 열지 않습니다. web 이 대신 받습니다.
    expose:
      - "8080"

  web:
    build:
      context: ./frontend
      args:
        # 비워 두면 브라우저가 자기 주소로 /api 를 부릅니다. nginx 가 넘깁니다.
        EXPO_PUBLIC_API_BASE: ""
    container_name: fit-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8080}:80"

volumes:
  fit-db:
