# ============================================================================
#  정적 파일을 내보내고, /api 는 API 컨테이너로 넘깁니다.
#  ---------------------------------------------------------------------------
#  브라우저 입장에서 화면과 API 가 같은 주소가 됩니다. 그래서
#    · CORS 를 탈 일이 없고,
#    · 리프레시 쿠키가 SameSite=Lax 로도 잘 실립니다.
#  다른 주소로 나누면 쿠키를 SameSite=None 으로 풀어야 하고, 그건 그만큼
#  느슨해지는 것입니다.
# ============================================================================

# 경로마다 다른 캐시 정책.
#
# add_header 는 location 안에 하나라도 쓰면 바깥(server)에 있는 것들을
# 물려받지 않습니다. 그래서 location 마다 add_header 를 쓰면 아래 보안
# 헤더가 조용히 사라집니다. 값을 여기서 정하고, add_header 는 server 에
# 한 벌만 둡니다.
#
# 빈 문자열이면 nginx 가 그 헤더를 아예 붙이지 않습니다. /api 는 스프링
# 시큐리티가 이미 no-store 를 붙여 주므로 겹쳐 쓰지 않습니다.
map $uri $fit_cache_control {
    default            "no-cache";
    ~^/_expo/          "public, max-age=31536000, immutable";
    ~^/assets/         "public, max-age=2592000";
    # 글꼴과 아이콘은 이름에 해시가 없습니다. 영원히 담아 두면 바꿔 올려도
    # 옛것이 남습니다. 한 달이면 충분히 아끼고 충분히 갈립니다.
    ~^/(fonts|icons)/  "public, max-age=2592000";
    # 서비스 워커는 절대 담아 두면 안 됩니다. 이것이 담기면 새 판을 올려도
    # 옛 워커가 계속 살아 화면이 갱신되지 않습니다.
    ~^/sw\.js$         "no-store";
    ~^/api/            "";
}

# 링크를 붙여 넣으면 대신 열어 보고 카드를 만들어 주는 것들.
#
# 우리 화면은 브라우저가 자바스크립트를 돌려야 그려지므로, 이들이 받아 가는
# index.html 에는 제목도 그림도 없습니다. 그래서 이들만 골라 서버가 만든 한
# 장(/api/posts/{id}/card)으로 보냅니다.
#
# 검색 크롤러(Googlebot 같은 것)는 넣지 않습니다. 사람과 다른 것을 주는 셈이
# 되고, 그쪽이 받아 갈 것은 본문이 아니라 요약 한 줄뿐이라 얻는 것도 없습니다.
map $http_user_agent $fit_unfurl {
    default  0;
    "~*(facebookexternalhit|Facebot|Twitterbot|Slackbot|Discordbot|TelegramBot|WhatsApp|LinkedInBot|SkypeUriPreview|redditbot|Pinterest|Iframely|Embedly|vkShare|kakaotalk)"  1;
}

# 앞에 또 다른 프록시(예: cloudflared)가 있으면 그쪽이 원래 프로토콜을
# 알려 줍니다. 그것을 그대로 넘겨야 서버가 https 로 들어온 요청인 줄 압니다.
# 없으면 우리가 받은 것을 씁니다.
map $http_x_forwarded_proto $fit_proto {
    default            $scheme;
    "~^(https|http)$"  $http_x_forwarded_proto;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 화면만 내보냅니다. 파일을 받는 곳이 아니라 크게 잡을 이유가 없습니다.
    client_max_body_size 2m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml
               application/manifest+json;
    gzip_min_length 1024;

    add_header Cache-Control          $fit_cache_control always;
    add_header X-Frame-Options        "DENY"      always;
    add_header X-Content-Type-Options "nosniff"   always;
    add_header Referrer-Policy        "same-origin" always;

    # ------------------------------------------------------------------ API
    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;

        # 서버가 원래 주소·프로토콜을 알아야 합니다.
        # (application.yml 의 forward-headers-strategy: framework)
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fit_proto;
        proxy_set_header X-Forwarded-Host  $host;

        # 로그인·정산처럼 오래 걸릴 일이 없는 API 입니다. 오래 매달리지 않습니다.
        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
        proxy_buffering off;
    }

    # -------------------------------------------------------------- 정적 파일
    # 이름에 해시가 붙어 있어 내용이 바뀌면 이름도 바뀝니다. 길게 담아 둡니다.
    location /_expo/ {
        try_files $uri =404;
    }

    location /assets/ {
        try_files $uri =404;
    }

    location /fonts/ {
        try_files $uri =404;
    }

    location /icons/ {
        try_files $uri =404;
    }

    # ------------------------------------------------------------ 설치용
    # 없는 주소를 index.html 로 넘기는 규칙에 이것들이 걸리면, 브라우저는
    # 설명서 자리에서 HTML 을 받아 들고 "설치" 를 안 내줍니다.
    location = /manifest.json {
        default_type application/manifest+json;
        try_files $uri =404;
    }

    location = /sw.js {
        # 워커가 뿌리 전체를 맡아야 어느 주소로 들어와도 붙습니다.
        add_header Service-Worker-Allowed "/" always;
        add_header Cache-Control          "no-store" always;
        add_header X-Frame-Options        "DENY"      always;
        add_header X-Content-Type-Options "nosniff"   always;
        add_header Referrer-Policy        "same-origin" always;
        try_files $uri =404;
    }

    # ------------------------------------------------------- 링크 미리보기
    # 올라온 글 하나의 주소. 사람은 아래 화면 규칙과 똑같이 받고, 링크를
    # 펼치는 것들만 서버가 만든 카드 한 장으로 보냅니다.
    #
    # if 는 되도록 안 쓰는 것이 좋지만 return 한 줄만 두는 것은 안전한 축에
    # 듭니다. 한 블록에서 try_files 와 proxy_pass 를 섞지 않으려고, 418 로
    # 튕겨 이름 붙인 자리로 넘깁니다.
    location ~ ^/community/[A-Za-z0-9_-]+$ {
        error_page 418 = @unfurl;
        if ($fit_unfurl) {
            return 418;
        }
        try_files $uri $uri.html /index.html;
    }

    location @unfurl {
        # add_header 를 하나라도 쓰면 바깥(server)의 것들을 물려받지 않습니다.
        # 보안 헤더를 여기에 다시 적고, 캐시는 서버가 붙여 보낸 것을 그대로
        # 내보냅니다 — 여기서 no-cache 를 덧붙이면 같은 글을 붙여 넣을 때마다
        # 다시 만들게 됩니다.
        add_header X-Frame-Options        "DENY"        always;
        add_header X-Content-Type-Options "nosniff"     always;
        add_header Referrer-Policy        "same-origin" always;

        # proxy_pass 에 변수를 섞으면 nginx 가 api 를 요청 때마다 다시 찾으려
        # 들고, 그러려면 resolver 가 있어야 합니다. 주소를 먼저 고쳐 두고
        # 변수 없는 proxy_pass 로 넘깁니다 — /api/ 쪽과 같은 방식입니다.
        rewrite ^/community/(.+)$ /api/posts/$1/card break;
        proxy_pass http://api:8080;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fit_proto;
        proxy_set_header X-Forwarded-Host  $host;

        # 펼치는 쪽은 오래 기다려 주지 않습니다. 늦게 주느니 카드를 포기하고
        # 사람이 누를 수 있는 맨 주소로 두는 편이 낫습니다.
        proxy_connect_timeout 5s;
        proxy_read_timeout    10s;
    }

    # ------------------------------------------------------------------ 화면
    # expo 가 라우트마다 html 을 만들어 둡니다(app.json 의 web.output: static).
    # 그래서 $uri.html 을 먼저 찾고, 없으면 index.html 로 넘겨 클라이언트
    # 라우터가 처리하게 합니다.
    location / {
        try_files $uri $uri.html $uri/index.html /index.html;
    }
}
