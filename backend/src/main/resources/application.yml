spring:
  application:
    name: fit-api

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/fit}
    username: ${DB_USER:fit}
    password: ${DB_PASSWORD:fit}

  jpa:
    hibernate:
      # 스키마는 Flyway 가 만듭니다. Hibernate 가 손대면 안 됩니다.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    baseline-on-migrate: true

  jackson:
    default-property-inclusion: non_null

server:
  port: ${PORT:8080}
  # nginx·Cloudflare 뒤에 있으므로 원래 프로토콜·주소를 헤더에서 읽습니다.
  forward-headers-strategy: framework
  error:
    include-message: never
    include-stacktrace: never

fit:
  # 운영에서는 반드시 환경변수로 넣습니다. 32바이트 이상이어야 합니다.
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-please-change-me-32b+}
    access-ttl: ${JWT_ACCESS_TTL:15m}
    refresh-ttl: ${JWT_REFRESH_TTL:30d}
    secure-cookie: ${SECURE_COOKIE:true}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173}
  setup-token: ${SETUP_TOKEN:}

  google:
    # 장소 검색용 서버 키. 웹에서 쓰는 키와 달라야 합니다 — 그쪽은 리퍼러로
    # 묶여 있는데 서버가 부를 때는 리퍼러가 없어 거절당합니다.
    # 비워 두면 검색이 꺼지고 좌표를 직접 넣는 길만 남습니다.
    maps-key: ${GOOGLE_MAPS_KEY:}

  social:
    google:
      # 구글로 로그인하기. 브라우저가 받아 온 토큰이 "우리에게 준 것" 인지를
      # 이 값으로 봅니다 — 안 보면 남의 앱에 발급된 토큰으로 들어옵니다.
      #
      # 장소 검색 키와 다른 것입니다. 이쪽은 Google Cloud 콘솔의
      # "OAuth 2.0 클라이언트 ID"(웹 애플리케이션)이고, 비밀이 아니라
      # 브라우저에도 나갑니다.
      #
      # 비워 두면 구글 로그인이 꺼지고 단추도 안 뜹니다.
      client-id: ${GOOGLE_CLIENT_ID:}

      # 앱에서 오는 토큰의 임자들. 쉼표로 나열합니다.
      #
      # 구글은 쪽마다 다른 클라이언트 ID 를 내주고(웹/iOS/안드로이드),
      # ID 토큰에는 받아 간 쪽의 ID 가 박혀 옵니다. 위 client-id 하나만
      # 보면 앱에서 온 토큰이 전부 거절됩니다.
      #
      # 비워 두면 웹 것 하나만 봅니다 - 앱 로그인을 안 켠 서버는 그대로입니다.
      audiences: ${GOOGLE_AUDIENCES:}

logging:
  level:
    net.weeniebeenie.fit: INFO
