spring:
  application:
    name: fit-api

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/fit}
    username: ${DB_USER:fit}
    password: ${DB_PASSWORD:fit}

  jpa:
    hibernate:
      # 스키마는 Flyway 가 만듭니다. Hibernate 가 손대면 안 됩니다.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    baseline-on-migrate: true

  jackson:
    default-property-inclusion: non_null

  # 사진 한 장의 크기.
  #
  # 스프링의 기본값은 1MB 라, 이것을 안 올리면 폰 사진이 서버에 닿기도 전에
  # 잘립니다. 서비스 쪽 한도(12MB)보다 조금 넉넉히 둡니다 — 여기서 걸리면
  # 우리 문구가 아니라 톰캣의 오류가 나갑니다.
  servlet:
    multipart:
      max-file-size: 14MB
      max-request-size: 14MB

server:
  port: ${PORT:8080}
  # nginx·Cloudflare 뒤에 있으므로 원래 프로토콜·주소를 헤더에서 읽습니다.
  forward-headers-strategy: framework
  error:
    include-message: never
    include-stacktrace: never

fit:
  # 운영에서는 반드시 환경변수로 넣습니다. 32바이트 이상이어야 합니다.
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-please-change-me-32b+}
    access-ttl: ${JWT_ACCESS_TTL:15m}
    refresh-ttl: ${JWT_REFRESH_TTL:30d}
    secure-cookie: ${SECURE_COOKIE:true}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173}
  setup-token: ${SETUP_TOKEN:}

  # 올라온 사진이 놓이는 폴더.
  #
  # 그림은 DB 에 안 넣습니다 — 몇 메가짜리를 줄마다 넣으면 백업이 그만큼
  # 무거워지고, 백업이 무거워지면 안 하게 됩니다.
  #
  # 도커에서는 반드시 볼륨을 가리켜야 합니다. 컨테이너 안의 폴더에 두면 다시
  # 올릴 때마다 사진이 통째로 사라집니다(docker-compose.yml 참고).
  #
  # 비워 두면 서버를 띄운 자리 옆의 photos 폴더입니다. 개발할 때 편합니다.
  # 위치 알리기 · 깃발(위치를 서버로 받아 동행자에게 보이는 것). 위치기반서비스사업
  # 신고를 마치기 전에는 끕니다 — trip/api/LiveController 의 머리말.
  live-sharing:
    enabled: ${LIVE_SHARING_ENABLED:false}
  photos:
    dir: ${PHOTOS_DIR:}

  google:
    # 장소 검색용 서버 키. 웹에서 쓰는 키와 달라야 합니다 — 그쪽은 리퍼러로
    # 묶여 있는데 서버가 부를 때는 리퍼러가 없어 거절당합니다.
    # 비워 두면 검색이 꺼지고 좌표를 직접 넣는 길만 남습니다.
    maps-key: ${GOOGLE_MAPS_KEY:}

  social:
    google:
      # 구글로 로그인하기. 브라우저가 받아 온 토큰이 "우리에게 준 것" 인지를
      # 이 값으로 봅니다 — 안 보면 남의 앱에 발급된 토큰으로 들어옵니다.
      #
      # 장소 검색 키와 다른 것입니다. 이쪽은 Google Cloud 콘솔의
      # "OAuth 2.0 클라이언트 ID"(웹 애플리케이션)이고, 비밀이 아니라
      # 브라우저에도 나갑니다.
      #
      # 비워 두면 구글 로그인이 꺼지고 단추도 안 뜹니다.
      client-id: ${GOOGLE_CLIENT_ID:}

      # 앱에서 오는 토큰의 임자들. 쉼표로 나열합니다.
      #
      # 구글은 쪽마다 다른 클라이언트 ID 를 내주고(웹/iOS/안드로이드),
      # ID 토큰에는 받아 간 쪽의 ID 가 박혀 옵니다. 위 client-id 하나만
      # 보면 앱에서 온 토큰이 전부 거절됩니다.
      #
      # 비워 두면 웹 것 하나만 봅니다 - 앱 로그인을 안 켠 서버는 그대로입니다.
      audiences: ${GOOGLE_AUDIENCES:}

    kakao:
      # 카카오로 로그인하기. 카카오 콘솔 > 앱 키 > REST API 키.
      # 비워 두면 카카오 로그인이 꺼지고 단추도 안 뜹니다.
      rest-key: ${KAKAO_REST_KEY:}

      # 카카오 로그인 > 보안 > Client Secret 을 「사용함」으로 켰을 때만.
      client-secret: ${KAKAO_CLIENT_SECRET:}

      # 카카오 콘솔에 등록한 Redirect URI 와 한 글자도 달라선 안 됩니다.
      # 비우면 운영 주소(https://fit.weenie-beenie.net/api/auth/kakao/callback)입니다.
      # 개발에서 쓰려면 http://localhost:8080/api/auth/kakao/callback 을 콘솔에도
      # 더하고 여기에 넣습니다.
      redirect-uri: ${KAKAO_REDIRECT_URI:}

logging:
  level:
    net.weeniebeenie.fit: INFO
